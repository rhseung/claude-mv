name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install_args: --locked
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: 훅 번들이 소스와 어긋남
        if: matrix.os == 'ubuntu-latest'
        run: bun run build && git diff --exit-code plugin/hooks/session-start.mjs

      - name: plugin.json 버전이 package.json 과 어긋남
        if: matrix.os == 'ubuntu-latest'
        run: bun run sync:version --check
      - name: zsh completion 문법 검사
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          bun run build
          node dist/index.js completion zsh > /tmp/_claude-mv
          zsh -n /tmp/_claude-mv
